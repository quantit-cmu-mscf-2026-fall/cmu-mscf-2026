# Parameters for research/evaluate_factors.py (QUANTIT-81).
#
# The grid of trading specs every stored factor is evaluated under. A
# (factor, spec) is a variant: a candidate, a ledger trial and a matrix
# column, so the grid multiplies the trial count the funnel corrects for.
# Choose it before seeing results, and keep it short.
#
# holds: rebalance every `hold` trading days, holding in between
#   (1 = daily, 5 = weekly, 21 = monthly).
# neutral: "none" demeans the signal across the universe; "sector" demeans it
#   within each 2-digit SIC group (or its SIC division when the group is thin).
# Costs are half the quoted spread; the full spread is reported alongside as
# a robustness view, not a grid dimension (it adds no trials).
holds = [1, 5, 21]
neutral = ["none", "sector"]
