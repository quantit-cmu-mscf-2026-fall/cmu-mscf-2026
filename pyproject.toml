[project]
name = "capstone-starter"
version = "0.1.0"
description = "Starter kit for the Quantit x CMU MSCF Fall 2026 capstone (46-983)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["capstone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: requires internet access (skips cleanly if unavailable)"]

[tool.ruff]
line-length = 100
target-version = "py311"
