# Alpha-GPT baseline (Seed + Analyst) on synthetic OHLCV with a planted
# one-day reversal. Expected: held-out folds confirm a reversal-type alpha
# (positive held-out IC in most folds) and TEST confirms the final selection.
name = "baseline_synth"
idea = "Stocks that fell sharply recently tend to bounce back, and stocks that rose sharply tend to give back their gains."
seed = 0

[data]
source = "synthetic"
n_dates = 1260
n_assets = 100
n_sectors = 10
pattern = "reversal"
strength = 0.03

[splits]
test_frac = 0.2
embargo_days = 5

[cv]
n_splits = 4
embargo_pct = 0.01

[scoring]
label_horizon = 1
cost_bps = 0.0
min_assets = 20

[loop]
n_rounds = 3
n_alphas = 5
max_attempts = 3
top_k = 1
max_trials = 100

[llm]
timeout_s = 300
model = ""
